<style>
    body { margin: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 12px; }
    #color-picker { display: flex; gap: 8px; margin-bottom: 8px; }
    .color-btn {
        width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent;
        cursor: pointer; outline: none;
    }
    .color-btn.selected { border-color: white; box-shadow: 0 0 0 2px #333; }
</style>

<div id="color-picker">
    <button class="color-btn selected" data-color="#000000" style="background:#000000"></button>
    <button class="color-btn" data-color="#FF3B30" style="background:#FF3B30"></button>
    <button class="color-btn" data-color="#34C759" style="background:#34C759"></button>
    <button class="color-btn" data-color="#007AFF" style="background:#007AFF"></button>
    <button class="color-btn" data-color="#FFCC00" style="background:#FFCC00"></button>
</div>

<canvas id="canvas" width="1024" height="768" style="border: 1px solid black;"></canvas>

<script type="module" src="drawing.js"></script>
