<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    #color-picker { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 10; }
    .color-btn {
        width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent;
        cursor: pointer; outline: none;
    }
    .color-btn.selected { border-color: white; box-shadow: 0 0 0 2px #333; }
    canvas { display: block; }
</style>

<div id="color-picker">
    <button class="color-btn selected" data-color="#000000" style="background:#000000"></button>
    <button class="color-btn" data-color="#FF3B30" style="background:#FF3B30"></button>
    <button class="color-btn" data-color="#34C759" style="background:#34C759"></button>
    <button class="color-btn" data-color="#007AFF" style="background:#007AFF"></button>
    <button class="color-btn" data-color="#FFCC00" style="background:#FFCC00"></button>
</div>

<canvas id="canvas"></canvas>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="drawing.js"></script>
